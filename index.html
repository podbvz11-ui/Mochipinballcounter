<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공 개수 정리판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 한 열 작업대 — 설정 줄, 입력 줄, 합계 줄, 직접 고칠 수 있는 목록 박스 순서 */
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#1d2430; --muted:#5f6b7a; --line:#d5dbe3;
  --accent:#2f6fd6; --accent-ink:#ffffff; --ball:#e8b73a; --danger:#c43d3d; --soft:#e6edf8;
  --f-display:"Gowun Dodum","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1b2129; --fg:#e7ebf0; --muted:#94a0ae; --line:#2e3742;
  --accent:#6a9cf0; --accent-ink:#0d1420; --ball:#f0c552; --danger:#ec6f6f; --soft:#1f2a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1b2129; --fg:#e7ebf0; --muted:#94a0ae; --line:#2e3742;
  --accent:#6a9cf0; --accent-ink:#0d1420; --ball:#f0c552; --danger:#ec6f6f; --soft:#1f2a3a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-size:1.7rem;margin:0;text-wrap:balance;display:flex;align-items:center;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#themeBtn{padding:6px 12px;font-size:.85rem}
h1 .dot{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8 0 20%,transparent 22%),var(--ball);flex:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.04em}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
input,textarea{font:inherit;font-size:1rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;box-sizing:border-box}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.price-row{display:flex;align-items:center;gap:10px}
.price-row input{max-width:200px;text-align:right}
.price-row span{color:var(--muted)}
.add{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.add input#money{text-align:right}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid transparent;padding:10px 16px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.ghost.warn{color:var(--danger)}
.preview{font-size:.85rem;color:var(--muted);min-height:1.3em}
.preview b{color:var(--fg)}
.msg{font-size:.85rem;color:var(--danger)}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot{background:var(--soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tot .v{font-family:var(--f-num);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.tot .k{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.box-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.box-head h2{font-size:1rem;margin:0}
.box-head .acts{display:flex;gap:8px;flex-wrap:wrap}
.box-head button{padding:6px 12px;font-size:.85rem}
#box{border:2px solid var(--fg);border-radius:10px;background:var(--panel);min-height:140px;resize:vertical;
  font-size:1.1rem;font-weight:600;line-height:1.8;padding:12px 16px}
#box::placeholder{color:var(--muted);font-weight:400}
.note{font-size:.8rem;color:var(--muted);margin:0}
.warnline{font-size:.82rem;color:var(--danger);margin:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
@media (max-width:480px){.add{grid-template-columns:1fr 1fr}.add button{grid-column:1/-1}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1><span class="dot" aria-hidden="true"></span>공 개수 정리판</h1>
    <button type="button" class="ghost" id="themeBtn">화면: 자동</button>
  </div>

  <section class="panel">
    <div class="field">
      <label for="price">공 1개당 가격</label>
      <div class="price-row"><input id="price" class="num" lang="ko" autocomplete="off" value="1,000"><span>원</span></div>
    </div>
  </section>

  <section class="panel">
    <form id="addForm" class="add" autocomplete="off">
      <div class="field"><label for="nick">닉네임</label><input id="nick" lang="ko" placeholder="닉네임"></div>
      <div class="field"><label for="money">받은 돈 (원)</label><input id="money" class="num" lang="ko" placeholder="0"></div>
      <button type="submit" class="primary">추가</button>
    </form>
    <div class="preview" id="preview"></div>
    <div class="msg" id="msg" hidden></div>
    <p class="note">같은 닉네임을 다시 입력하면 공 개수가 합쳐져요. Enter로도 추가됩니다.</p>
  </section>

  <section class="totals">
    <div class="tot"><span class="k">현재까지 공 개수</span><span class="v" id="totBalls">0</span></div>
    <div class="tot"><span class="k">받은 돈 합계</span><span class="v" id="totMoney">0원</span></div>
  </section>

  <section class="panel" style="gap:10px">
    <div class="box-head">
      <h2>닉네임 / 공 개수</h2>
      <div class="acts">
        <button type="button" class="ghost" id="copyBtn">목록 복사</button>
        <button type="button" class="ghost warn" id="resetBtn">전체 초기화</button>
      </div>
    </div>
    <div class="confirm" id="confirm" hidden>
      <span>목록을 모두 지울까요?</span>
      <button type="button" class="ghost warn" id="yesReset">지우기</button>
      <button type="button" class="ghost" id="noReset">취소</button>
    </div>
    <textarea id="box" lang="ko" spellcheck="false" aria-label="닉네임/공 개수 목록" placeholder="예: 김민교/3, 모치/4, 꼼모리/3"></textarea>
    <p class="warnline" id="badLine" hidden></p>
    <p class="note">박스 안 글자를 직접 지우거나 고쳐 쓸 수 있어요. <b>닉네임/숫자</b>를 쉼표로 구분하면 합계에 바로 반영돼요. 받은 돈 합계는 공 개수 × 공 1개당 가격이에요.</p>
    <p class="note">기록은 이 브라우저에만 저장돼요.</p>
  </section>
</div>

<script>
(function(){
  const KEY='ballCounter.v2';
  const $=id=>document.getElementById(id);
  const fmt=n=>Number(n||0).toLocaleString('ko-KR');
  const parseNum=s=>{const d=String(s).replace(/[^\d]/g,'');return d?parseInt(d,10):0};

  let state={price:1000,text:''};
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&typeof s.text==='string')state=s;
    else{
      const old=JSON.parse(localStorage.getItem('ballCounter.v1'));
      if(old&&Array.isArray(old.rows)){
        state.price=old.price||1000;
        state.text=old.rows.filter(r=>!String(r.nick).startsWith('예시_'))
          .map(r=>r.nick+'/'+(state.price?Math.floor(r.money/state.price):0)).join(', ');
      }
    }
  }catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  // "닉네임/숫자" 항목을 쉼표·줄바꿈으로 나눠 읽기. 닉네임에 /가 있어도 마지막 / 기준.
  function parseBox(text){
    const items=[],bad=[];
    text.split(/[,，\n]/).map(s=>s.trim()).filter(Boolean).forEach(seg=>{
      const i=seg.lastIndexOf('/');
      const nick=i>0?seg.slice(0,i).trim():'';
      const numStr=i>=0?seg.slice(i+1).trim():'';
      if(nick&&/^\d+$/.test(numStr.replace(/,/g,'')))items.push({nick,balls:parseInt(numStr.replace(/,/g,''),10)});
      else bad.push(seg);
    });
    return {items,bad};
  }
  const toText=items=>items.map(r=>r.nick+'/'+r.balls).join(', ');

  const price=$('price'),nick=$('nick'),money=$('money'),box=$('box');
  price.value=fmt(state.price);
  box.value=state.text;

  function commaInput(el){
    // 한글 조합 중에는 값을 건드리지 않아 입력기가 끊기지 않게 함
    el.addEventListener('compositionend',()=>el.dispatchEvent(new Event('input')));
    el.addEventListener('input',e=>{
      if(e.isComposing)return;
      const n=parseNum(el.value);
      if(el.value===(el.value.trim()===''?'':fmt(n)))return;
      el.value=el.value.trim()===''?'':fmt(n);
      el.setSelectionRange(el.value.length,el.value.length);
    });
  }
  commaInput(price);commaInput(money);

  function updateTotals(){
    const {items,bad}=parseBox(box.value);
    const tb=items.reduce((a,r)=>a+r.balls,0);
    $('totBalls').textContent=fmt(tb);
    $('totMoney').textContent=fmt(tb*state.price)+'원';
    const b=$('badLine');
    if(bad.length){b.textContent='계산에서 빠진 항목: '+bad.join(', ')+' (닉네임/숫자 형식으로 써 주세요)';b.hidden=false;}
    else b.hidden=true;
  }

  function updatePreview(){
    const m=parseNum(money.value),p=$('preview');
    if(!m||!state.price){p.textContent='';return;}
    p.innerHTML='→ 공 <b class="num">'+fmt(Math.floor(m/state.price))+'</b>개'+(m%state.price?' · 남는 금액 '+fmt(m%state.price)+'원':'');
  }

  price.addEventListener('input',()=>{state.price=parseNum(price.value);save();updateTotals();updatePreview();});
  money.addEventListener('input',updatePreview);
  box.addEventListener('input',()=>{state.text=box.value;save();updateTotals();});

  $('addForm').addEventListener('submit',e=>{
    e.preventDefault();
    const msg=$('msg');msg.hidden=true;
    const n=nick.value.trim().replace(/[,，\n]/g,' '),m=parseNum(money.value);
    if(!state.price){msg.textContent='공 1개당 가격을 먼저 입력하세요.';msg.hidden=false;return;}
    if(!n){msg.textContent='닉네임을 입력하세요.';msg.hidden=false;nick.focus();return;}
    if(!m){msg.textContent='받은 돈을 입력하세요.';msg.hidden=false;money.focus();return;}
    const add=Math.floor(m/state.price);
    if(!add){msg.textContent='받은 돈이 공 1개 가격보다 적어요.';msg.hidden=false;return;}
    const {items,bad}=parseBox(box.value);
    const ex=items.find(r=>r.nick===n);
    if(ex)ex.balls+=add;else items.push({nick:n,balls:add});
    box.value=toText(items)+(bad.length?', '+bad.join(', '):'');
    state.text=box.value;save();
    nick.value='';money.value='';nick.focus();
    updateTotals();updatePreview();
  });

  $('resetBtn').onclick=()=>{$('confirm').hidden=false;};
  $('noReset').onclick=()=>{$('confirm').hidden=true;};
  $('yesReset').onclick=()=>{box.value='';state.text='';save();updateTotals();$('confirm').hidden=true;};

  $('copyBtn').onclick=async()=>{
    const btn=$('copyBtn');
    try{await navigator.clipboard.writeText(box.value);btn.textContent='복사됨';}
    catch(e){box.select();btn.textContent='Ctrl+C로 복사';}
    setTimeout(()=>btn.textContent='목록 복사',1500);
  };

  // 화면 모드: 자동(기기 설정 따라감) → 라이트 → 다크
  const THEME_KEY='ballCounter.theme';
  const themes=['auto','light','dark'],labels={auto:'화면: 자동',light:'화면: 라이트',dark:'화면: 다크'};
  let theme='auto';
  try{theme=localStorage.getItem(THEME_KEY)||'auto';}catch(e){}
  function applyTheme(){
    if(theme==='auto')document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme',theme);
    $('themeBtn').textContent=labels[theme]||labels.auto;
  }
  $('themeBtn').onclick=()=>{
    theme=themes[(themes.indexOf(theme)+1)%themes.length];
    try{localStorage.setItem(THEME_KEY,theme);}catch(e){}
    applyTheme();
  };
  applyTheme();

  updateTotals();
})();
</script>
</body>
</html>
